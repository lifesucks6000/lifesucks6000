<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" width="960" height="292" role="img" aria-labelledby="t d"><title id="t">How data moves through my systems</title><desc id="d">Animated flow from ingest to process to learn to store to serve, with measured results under each stage and an observability loop above.</desc><style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;}</style><rect x="0.5" y="0.5" width="959" height="291" rx="12" fill="#0E1521" stroke="#26344B"/><path d="M846.0 104 V60 H110.0 V104" fill="none" stroke="#6C94D8" stroke-opacity="0.55" stroke-dasharray="3 7" stroke-width="1.5"><animate attributeName="stroke-dashoffset" from="0" to="20" dur="1.2s" repeatCount="indefinite"/></path><rect x="336.4" y="49" width="283.2" height="22" fill="#0E1521"/><text x="348.4" y="64" font-size="12" fill="#6C94D8" font-weight="normal" textLength="259.2" lengthAdjust="spacing" xml:space="preserve" >observe · grafana · prometheus · elk</text><line x1="14" y1="141.0" x2="946" y2="141.0" stroke="#26344B" stroke-width="2"/><rect x="40" y="104" width="140" height="74" rx="8" fill="#131D2E" stroke="#26344B" stroke-width="1.5"><animate attributeName="stroke" values="#26344B;#6C94D8;#6C94D8;#26344B;#26344B" keyTimes="0;0.04;0.58;0.64;1" dur="1.8s" begin="0.201s" repeatCount="indefinite"/></rect><text x="79.4" y="129" font-size="17" fill="#F3F7FF" font-weight="bold" textLength="61.2" lengthAdjust="spacing" xml:space="preserve" >ingest</text><text x="47.3" y="165" font-size="11" fill="#6F7F99" font-weight="normal" textLength="125.4" lengthAdjust="spacing" xml:space="preserve" >kafka · rest · grpc</text><text x="86.0" y="218" font-size="20" fill="#F2B24C" font-weight="bold" textLength="48.0" lengthAdjust="spacing" xml:space="preserve" >15M+</text><text x="52.4" y="240" font-size="12" fill="#B8C4D9" font-weight="normal" textLength="115.2" lengthAdjust="spacing" xml:space="preserve" >records a month,</text><text x="59.6" y="257" font-size="12" fill="#6F7F99" font-weight="normal" textLength="100.8" lengthAdjust="spacing" xml:space="preserve" >99.9% reliable</text><rect x="224" y="104" width="140" height="74" rx="8" fill="#131D2E" stroke="#26344B" stroke-width="1.5"><animate attributeName="stroke" values="#26344B;#6C94D8;#6C94D8;#26344B;#26344B" keyTimes="0;0.04;0.58;0.64;1" dur="1.8s" begin="1.622s" repeatCount="indefinite"/></rect><text x="258.3" y="129" font-size="17" fill="#F3F7FF" font-weight="bold" textLength="71.4" lengthAdjust="spacing" xml:space="preserve" >process</text><text x="234.6" y="165" font-size="11" fill="#6F7F99" font-weight="normal" textLength="118.8" lengthAdjust="spacing" xml:space="preserve" >go · node · python</text><text x="246.0" y="218" font-size="20" fill="#F2B24C" font-weight="bold" textLength="96.0" lengthAdjust="spacing" xml:space="preserve" >30d → 3d</text><text x="240.0" y="240" font-size="12" fill="#B8C4D9" font-weight="normal" textLength="108.0" lengthAdjust="spacing" xml:space="preserve" >data processing</text><text x="207.6" y="257" font-size="12" fill="#6F7F99" font-weight="normal" textLength="172.8" lengthAdjust="spacing" xml:space="preserve" >time, parsers 10x faster</text><rect x="408" y="104" width="140" height="74" rx="8" fill="#131D2E" stroke="#26344B" stroke-width="1.5"><animate attributeName="stroke" values="#26344B;#6C94D8;#6C94D8;#26344B;#26344B" keyTimes="0;0.04;0.58;0.64;1" dur="1.8s" begin="3.044s" repeatCount="indefinite"/></rect><text x="452.5" y="129" font-size="17" fill="#F3F7FF" font-weight="bold" textLength="51.0" lengthAdjust="spacing" xml:space="preserve" >learn</text><text x="418.6" y="165" font-size="11" fill="#6F7F99" font-weight="normal" textLength="118.8" lengthAdjust="spacing" xml:space="preserve" >transformers · rag</text><text x="442.0" y="218" font-size="20" fill="#F2B24C" font-weight="bold" textLength="72.0" lengthAdjust="spacing" xml:space="preserve" >1000/s</text><text x="409.6" y="240" font-size="12" fill="#B8C4D9" font-weight="normal" textLength="136.8" lengthAdjust="spacing" xml:space="preserve" >products classified</text><text x="395.2" y="257" font-size="12" fill="#6F7F99" font-weight="normal" textLength="165.6" lengthAdjust="spacing" xml:space="preserve" >95% acc · LLM cost −80%</text><rect x="592" y="104" width="140" height="74" rx="8" fill="#131D2E" stroke="#26344B" stroke-width="1.5"><animate attributeName="stroke" values="#26344B;#6C94D8;#6C94D8;#26344B;#26344B" keyTimes="0;0.04;0.58;0.64;1" dur="1.8s" begin="4.465s" repeatCount="indefinite"/></rect><text x="636.5" y="129" font-size="17" fill="#F3F7FF" font-weight="bold" textLength="51.0" lengthAdjust="spacing" xml:space="preserve" >store</text><text x="592.7" y="165" font-size="11" fill="#6F7F99" font-weight="normal" textLength="138.6" lengthAdjust="spacing" xml:space="preserve" >postgres · clickhouse</text><text x="596.0" y="218" font-size="20" fill="#F2B24C" font-weight="bold" textLength="132.0" lengthAdjust="spacing" xml:space="preserve" >20s → 500ms</text><text x="604.4" y="240" font-size="12" fill="#B8C4D9" font-weight="normal" textLength="115.2" lengthAdjust="spacing" xml:space="preserve" >query latency on</text><text x="597.2" y="257" font-size="12" fill="#6F7F99" font-weight="normal" textLength="129.6" lengthAdjust="spacing" xml:space="preserve" >six-month datasets</text><rect x="776" y="104" width="140" height="74" rx="8" fill="#131D2E" stroke="#26344B" stroke-width="1.5"><animate attributeName="stroke" values="#26344B;#6C94D8;#6C94D8;#26344B;#26344B" keyTimes="0;0.04;0.58;0.64;1" dur="1.8s" begin="5.887s" repeatCount="indefinite"/></rect><text x="820.5" y="129" font-size="17" fill="#F3F7FF" font-weight="bold" textLength="51.0" lengthAdjust="spacing" xml:space="preserve" >serve</text><text x="783.3" y="165" font-size="11" fill="#6F7F99" font-weight="normal" textLength="125.4" lengthAdjust="spacing" xml:space="preserve" >checkout · payments</text><text x="780.0" y="218" font-size="20" fill="#F2B24C" font-weight="bold" textLength="132.0" lengthAdjust="spacing" xml:space="preserve" >2 platforms</text><text x="770.4" y="240" font-size="12" fill="#B8C4D9" font-weight="normal" textLength="151.2" lengthAdjust="spacing" xml:space="preserve" >one checkout service,</text><text x="784.8" y="257" font-size="12" fill="#6F7F99" font-weight="normal" textLength="122.4" lengthAdjust="spacing" xml:space="preserve" >stripe and paypal</text><line x1="14" y1="141.0" x2="946" y2="141.0" stroke="#26344B" stroke-width="1.5" stroke-opacity="0.8"/><g transform="translate(0 141.0)"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#F2B24C"><animateMotion path="M14 0 H946" dur="7.2s" begin="-0.000s" repeatCount="indefinite"/><animate attributeName="fill" values="#F2B24C;#F3F7FF;#F3F7FF" keyTimes="0;0.2253;1" calcMode="discrete" dur="7.2s" begin="-0.000s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.97;1" dur="7.2s" begin="-0.000s" repeatCount="indefinite"/></rect></g><g transform="translate(0 141.0)"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#F2B24C"><animateMotion path="M14 0 H946" dur="7.2s" begin="-1.800s" repeatCount="indefinite"/><animate attributeName="fill" values="#F2B24C;#F3F7FF;#F3F7FF" keyTimes="0;0.2253;1" calcMode="discrete" dur="7.2s" begin="-1.800s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.97;1" dur="7.2s" begin="-1.800s" repeatCount="indefinite"/></rect></g><g transform="translate(0 141.0)"><rect x="-4" y="-4" width="8" height="8" rx="1.5" fill="#F2B24C"><animateMotion path="M14 0 H946" dur="7.2s" begin="-3.600s" repeatCount="indefinite"/><animate attributeName="fill" values="#F2B24C;#F3F7FF;#F3F7FF" keyTimes="0;0.2253;1" calcMode="discrete" dur="7.2s" begin="-3.600s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.97;1" dur="7.2s" begin="-3.600s" repeatCount="indefinite"/></rect></g><g transfor